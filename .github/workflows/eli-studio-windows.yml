name: Build Eli Studio v1.0.28 — Live V1 Fades and Long-form Cuts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
      - name: Download FFmpeg tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          $bin = Get-ChildItem ffmpeg-download -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" ffmpeg.exe
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" ffprobe.exe
      - name: Verify Python source syntax
        shell: pwsh
        run: |
          python -m py_compile launcher.py gui.py media.py version.py local_director.py director_executor.py longform_scene_planner.py eli_live_preview.py
          python test_eli_planner.py
      - name: Package Eli Studio
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name EliStudio --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --collect-all PySide6 --add-data "assets;assets" --add-data "effects_assets;effects_assets" --add-data "music_library;music_library" launcher.py
      - name: Archive Windows app
        shell: pwsh
        run: Compress-Archive -Path dist/EliStudio/* -DestinationPath Eli_Studio_v1.0.28.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Eli_Studio_v1.0.28
          path: Eli_Studio_v1.0.28.zip
