name: Build FragForge Windows (auto version)

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install --upgrade pip pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify sources
        shell: pwsh
        run: |
          $required = @(
            'launcher.py'
            'gui.py'
            'media.py'
            'version.py'
            'requirements.txt'
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Resolve version and verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $meta = python -c "import json,version; print(json.dumps({'version':version.VERSION,'artifact':version.ARTIFACT_NAME}))" | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read version.py'
          }

          if (!$meta.artifact) {
            throw 'Version metadata missing'
          }

          "FRAGFORGE_ARTIFACT=$($meta.artifact)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Building $($meta.artifact)"

          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $urls = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )

          $success = $false

          foreach ($url in $urls) {

            for ($attempt = 1; $attempt -le 3; $attempt++) {

              try {
                Write-Host "FFmpeg download attempt $attempt"
                Write-Host "Source: $url"

                Remove-Item ffmpeg.zip -Force -ErrorAction SilentlyContinue
                Remove-Item ffmpeg_extract -Recurse -Force -ErrorAction SilentlyContinue

                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile ffmpeg.zip `
                  -TimeoutSec 180

                if (!(Test-Path ffmpeg.zip)) {
                  throw 'FFmpeg archive not downloaded'
                }

                Expand-Archive `
                  -Path ffmpeg.zip `
                  -DestinationPath ffmpeg_extract `
                  -Force

                $ffmpeg = Get-ChildItem ffmpeg_extract -Recurse -File -Filter ffmpeg.exe |
                  Select-Object -First 1

                $ffprobe = Get-ChildItem ffmpeg_extract -Recurse -File -Filter ffprobe.exe |
                  Select-Object -First 1

                if (!$ffmpeg -or !$ffprobe) {
                  throw 'FFmpeg binaries missing from archive'
                }

                $success = $true
                break
              }
              catch {
                Write-Warning $_.Exception.Message

                Remove-Item ffmpeg.zip -Force -ErrorAction SilentlyContinue
                Remove-Item ffmpeg_extract -Recurse -Force -ErrorAction SilentlyContinue

                if ($attempt -lt 3) {
                  Start-Sleep -Seconds (10 * $attempt)
                }
              }
            }

            if ($success) { break }
          }

          if (!$success) {
            throw 'All FFmpeg download sources failed.'
          }

          New-Item -ItemType Directory -Force -Path tools | Out-Null

          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {

            $found = Get-ChildItem ffmpeg_extract -Recurse -File -Filter $name |
              Select-Object -First 1

            if (!$found) {
              throw "Missing $name"
            }

            Copy-Item `
              -Path $found.FullName `
              -Destination (Join-Path tools $name) `
              -Force

            Write-Host "Installed $name"
          }

          & .\tools\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\tools\ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name FragForge `
            --paths . `
            --collect-all PySide6 `
            --add-data "assets;assets" `
            --add-data "effects_assets;effects_assets" `
            --add-data "sound_assets;sound_assets" `
            --hidden-import version `
            --add-binary "tools/ffmpeg.exe;." `
            --add-binary "tools/ffprobe.exe;." `
            launcher.py

          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller build failed'
          }

      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $app = 'dist/FragForge'

          if (!(Test-Path "$app/FragForge.exe")) {
            throw 'FragForge.exe missing'
          }

          $extras = @(
            'Install-FragForge-LocalAI.ps1'
            'Create-MrDirector-Shortcut.ps1'
          )

          foreach ($file in $extras) {
            if (!(Test-Path $file)) {
              throw "Missing packaging file: $file"
            }

            Copy-Item $file "$app/" -Force
          }

          if (!(Test-Path 'assets/mr_director.ico')) {
            throw 'Mr Director icon missing'
          }

          Copy-Item 'assets/mr_director.ico' "$app/mr_director.ico" -Force

          $zip = "$env:FRAGFORGE_ARTIFACT.zip"

          Compress-Archive `
            -Path "$app/*" `
            -DestinationPath $zip `
            -Force

          if (!(Test-Path $zip)) {
            throw 'ZIP packaging failed'
          }

          Write-Host "Package ready: $zip"

      - name: Publish private GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = "$env:FRAGFORGE_ARTIFACT.zip"

          if (!(Test-Path $zip)) {
            throw "Missing release ZIP: $zip"
          }

          $tag = "$env:FRAGFORGE_ARTIFACT-build-$env:GITHUB_RUN_NUMBER"

          gh release create $tag $zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "$env:FRAGFORGE_ARTIFACT (build $env:GITHUB_RUN_NUMBER)" `
            --notes "Windows build from commit $env:GITHUB_SHA." `
            --latest=false

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publishing failed'
          }
