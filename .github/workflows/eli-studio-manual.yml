name: Build Eli Studio (manual)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing Eli Studio source
        required: true
        default: eli-studio-v1.0.0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout selected Eli Studio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Verify source syntax
        shell: pwsh
        run: python -m py_compile launcher.py gui.py media.py version.py local_director.py assistant_engine.py editor_x_brain.py director_executor.py vision_director.py ai_runtime.py test_eli_planner.py test_eli_scene_windows.py test_eli_transitions.py eli_timeline_ripple.py test_eli_ripple_delete.py eli_v1_context.py test_eli_v1_context.py eli_edit_contract.py test_eli_edit_contract.py test_eli_ui_fit.py test_eli_track_chat_vision.py
      - name: Test V1 ripple deletion
        shell: pwsh
        run: python test_eli_ripple_delete.py
      - name: Test V1-aware follow-up editing and playback clock
        shell: pwsh
        run: python test_eli_v1_context.py
      - name: Test Eli conversational speed parsing
        shell: pwsh
        run: python test_eli_speed_commands.py
      - name: Verify multi-scene speed and transition editing
        shell: pwsh
        run: python test_eli_edit_contract.py
      - name: Verify Eli Windows layout and editing wiring
        shell: pwsh
        run: python test_eli_ui_fit.py
      - name: Verify Eli chat and selected-V1 vision scanning
        shell: pwsh
        run: python test_eli_track_chat_vision.py
      - name: Test Eli request parsing and combat-priority montage
        shell: pwsh
        run: |
          python test_eli_planner.py
          if ($LASTEXITCODE -ne 0) { throw 'Eli montage planner regression failed; not packaging.' }
      - name: Test Eli doubled visual frames and estimated scene boundaries
        shell: pwsh
        run: |
          python test_eli_scene_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Scene boundary regression test failed; not packaging.' }
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $downloaded = $false
          foreach ($url in $sources) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              try {
                Write-Host "Downloading FFmpeg from $url (attempt $attempt)"
                if (Test-Path ffmpeg.zip) { Remove-Item ffmpeg.zip -Force }
                Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -TimeoutSec 180 -MaximumRedirection 10
                if ((Get-Item ffmpeg.zip).Length -lt 1000000) { throw 'FFmpeg archive is unexpectedly small' }
                if (Test-Path ffmpeg_download) { Remove-Item ffmpeg_download -Recurse -Force }
                Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_download -Force
                $bin = Get-ChildItem ffmpeg_download -Recurse -Filter ffmpeg.exe | Select-Object -First 1
                $probe = Get-ChildItem ffmpeg_download -Recurse -Filter ffprobe.exe | Select-Object -First 1
                if (-not $bin -or -not $probe) { throw 'Archive missing ffmpeg.exe or ffprobe.exe' }
                Copy-Item $bin.FullName ffmpeg.exe -Force
                Copy-Item $probe.FullName ffprobe.exe -Force
                & .\ffmpeg.exe -version
                & .\ffprobe.exe -version
                if ($LASTEXITCODE -ne 0) { throw 'FFprobe verification failed' }
                $downloaded = $true
                break
              } catch {
                Write-Warning "FFmpeg download/extract failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if ($downloaded) { break }
          }
          if (-not $downloaded) { throw 'All FFmpeg download sources failed' }
      - name: Verify Eli scene crossfades and final fades
        shell: pwsh
        run: |
          python test_eli_transitions.py
          if ($LASTEXITCODE -ne 0) { throw 'Eli transition regression test failed; not packaging this build.' }
      - name: Build Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name EliStudio --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --collect-all PySide6 --add-data "assets;assets" --add-data "effects_assets;effects_assets" --add-data "music_library;music_library" launcher.py
      - name: Archive versioned app
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          Compress-Archive -Path dist/EliStudio/* -DestinationPath "Eli_Studio_v$version.zip" -Force
          "PACKAGE=Eli_Studio_v$version" >> $env:GITHUB_ENV
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error
